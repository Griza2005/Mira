{% extends "base.html" %}

{% block title %}Nuevo Usuario - MIRA{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white py-3">
                <h5 class="mb-0 fw-bold">Registrar Nuevo Usuario</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('usuarios_create') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Nombre de Usuario</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password" minlength="6" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Correo Institucional</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="nombre_completo" class="form-label fw-semibold">Nombre Completo</label>
                        <input type="text" class="form-control" id="nombre_completo" name="nombre_completo">
                    </div>
                    <div class="mb-4">
                        <label for="rol_id" class="form-label fw-semibold">Rol Asignado</label>
                        <select class="form-select" id="rol_id" name="rol_id" required>
                            <option value="1">Administrador (Control Total)</option>
                            <option value="2">Editor (Creación y Edición)</option>
                            <option value="3" selected>Consulta (Solo Lectura)</option>
                        </select>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('usuarios_list') }}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary fw-bold">Guardar Usuario</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
