services:
  mira-postgres:
    image: postgres:16
    container_name: mira-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5544}:5432"
    volumes:
      - mira_postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mira-network

  mira-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mira-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      ConnectionStrings__PostgreSql: ${ConnectionStrings__PostgreSql}
    ports:
      - "8080:8080"
    depends_on:
      mira-postgres:
        condition: service_healthy
    networks:
      - mira-network

volumes:
  mira_postgres_data:

networks:
  mira-network:
    driver: bridge
